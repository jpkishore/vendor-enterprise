services:

  mysql:
    image: mysql:8.4
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - platform-network

  redis:
    image: redis:7
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - platform-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - platform-network

  catalog-service:
    image: platform/catalog-service:1.0
    container_name: platform-catalog
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9
    networks:
      - platform-network

  eureka-server:
    image: platform/eureka-server:1.0
    container_name: platform-eureka
    restart: unless-stopped

    ports:
      - "8761:8761"

    networks:
      - platform-network

  config-server:
    image: platform/config-server:1.0
    container_name: platform-config-server
    restart: unless-stopped

    ports:
      - "8888:8888"

    volumes:
      - ./config-repo:/config-repo

    depends_on:
      - eureka-server

    networks:
      - platform-network

  gateway-service:
    image: platform/gateway-service:1.0
    container_name: platform-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      - eureka-server
      - config-server

    networks:
      - platform-network

  inventory-service:
    image: platform/inventory-service:1.0
    container_name: platform-inventory
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9
    depends_on:
      - eureka-server
      - config-server
      - mysql
      - kafka

    networks:
      - platform-network

  auth-service:
    image: platform/auth-service:1.0
    container_name: platform-auth
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root

      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9

    depends_on:
      - mysql
      - eureka-server
      - config-server

    networks:
      - platform-network

  cart-service:
    image: platform/cart-service:1.0
    container_name: platform-cart
    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root

      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9

    depends_on:
      - mysql
      - eureka-server
      - config-server

    networks:
      - platform-network

  order-service:
    image: platform/order-service:1.0
    container_name: platform-order
    restart: unless-stopped

    ports:
      - "8085:8085"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root

      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9

    depends_on:
      - mysql
      - kafka
      - eureka-server
      - config-server
      - inventory-service

    networks:
      - platform-network

  payment-service:
    image: platform/payment-service:1.0
    container_name: platform-payment
    restart: unless-stopped

    ports:
      - "8086:8086"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root

      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9

    depends_on:
      - mysql
      - kafka
      - eureka-server
      - config-server

    networks:
      - platform-network

  notification-service:
    image: platform/notification-service:1.0
    container_name: platform-notification
    restart: unless-stopped

    ports:
      - "8087:8087"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

      JWT_SECRET: 8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9

    depends_on:
      - mysql
      - kafka
      - eureka-server
      - config-server

    networks:
      - platform-network

networks:
  platform-network:
    name: multi-vendor-platform_platform-network
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data: