server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:

          routes:

            # =========================
            # AUTH SERVICE
            # =========================

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            # =========================
            # AUTH USER APIs
            # =========================

            - id: auth-user-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/users/**

            # =========================
            # AUTH TEST / ROLE APIs
            # =========================

            - id: auth-role-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/test/**

            # =========================
            # CATALOG SERVICE
            # =========================

            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/v1/categories/**

            - id: catalog-product-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/v1/products/**

            # =========================
            # INVENTORY SERVICE
            # =========================

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**

            # =========================
            # CART SERVICE
            # =========================

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/v1/cart/**


            # =========================
            # ORDER SERVICE
            # =========================

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**

            # =========================
            # PAYMENT SERVICE
            # =========================

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**

            # =========================
            # NOTIFICATION SERVICE
            # =========================

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true