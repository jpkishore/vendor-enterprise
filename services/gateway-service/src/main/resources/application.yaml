server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            - id: auth-user-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/users/**
            - id: auth-role-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/test/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true