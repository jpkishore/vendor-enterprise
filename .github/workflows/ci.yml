name: Java Microservices CI

on:
  push:
    branches:
      - master
      - clean-recovery-9
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cart-service
          - catalog-service
          - config-server
          - discovery-server
          - gateway-service
          - inventory-service
          - notification-service
          - order-service
          - payment-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build and run tests
        env:
          SECURITY_JWT_SECRET: ci-only-test-secret-not-for-production-1234567890
        run: mvn --batch-mode --no-transfer-progress -f services/${{ matrix.service }}/pom.xml verify
