global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: spring-boot-services
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - auth-service.multi-vendor-platform.svc.cluster.local:8081
          - catalog-service.multi-vendor-platform.svc.cluster.local:8082
          - inventory-service.multi-vendor-platform.svc.cluster.local:8083
          - cart-service.multi-vendor-platform.svc.cluster.local:8084
          - order-service.multi-vendor-platform.svc.cluster.local:8085
          - payment-service.multi-vendor-platform.svc.cluster.local:8086
          - notification-service.multi-vendor-platform.svc.cluster.local:8087
          - gateway-service.multi-vendor-platform.svc.cluster.local:8080
          - config-server.multi-vendor-platform.svc.cluster.local:8888
          - eureka-server.multi-vendor-platform.svc.cluster.local:8761
