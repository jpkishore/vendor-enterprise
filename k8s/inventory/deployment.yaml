apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-service
  namespace: multi-vendor-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-service

  template:
    metadata:
      labels:
        app: inventory-service

    spec:
      containers:
        - name: inventory-service

          image: platform/inventory-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8083
              protocol: TCP

          env:

            # =========================
            # MySQL
            # =========================
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8"

            - name: DB_USERNAME
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            # =========================
            # Kafka
            # =========================
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            # =========================
            # Eureka
            # =========================
            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"

            # =========================
            # Config Server
            # =========================
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"

            # =========================
            # JWT
            # =========================
            - name: JWT_SECRET
              value: "8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9"

            # =========================
            # Internal Order Service Token
            # =========================
            - name: ORDER_SERVICE_TOKEN
              value: "order-service-internal-token"

            # =========================
            # Kafka Topics
            # =========================
            - name: KAFKA_INVENTORY_TOPIC
              value: "inventory-events"

            - name: KAFKA_ORDER_TOPIC
              value: "order-events"

            - name: KAFKA_NOTIFICATION_TOPIC
              value: "notification-events"

          # =========================
          # Readiness Probe
          # =========================
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083

            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # =========================
          # Liveness Probe
          # =========================
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3