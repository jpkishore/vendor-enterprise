apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalog-service
  namespace: multi-vendor-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalog-service

  template:
    metadata:
      labels:
        app: catalog-service

    spec:
      containers:
        - name: catalog-service

          image: platform/catalog-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          env:
            # =========================
            # MySQL
            # =========================
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8"

            - name: DB_USERNAME
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            # =========================
            # Redis
            # =========================
            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            # =========================
            # Kafka
            # =========================
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            # =========================
            # Eureka
            # =========================
            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"

            # =========================
            # Config Server
            # =========================
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3