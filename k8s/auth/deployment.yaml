apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: multi-vendor-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: platform/auth-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          env:

            # =========================
            # MySQL
            # =========================
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8"

            - name: DB_USERNAME
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            # =========================
            # Eureka
            # =========================
            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"

            # =========================
            # JWT
            # =========================
            - name: JWT_SECRET
              value: "8F9D7A2C4B6E8F1D3A5C7E9B1D2F4A6C8E0F2A4B6C8D1E3F5A7B9C1D3E5F7A9"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
