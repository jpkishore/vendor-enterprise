apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: multi-vendor-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: platform/auth-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          env:

            # =========================
            # Application Environment
            # =========================
            - name: SPRING_PROFILES_ACTIVE
              value: "uat"

            # =========================
            # JVM
            # =========================
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=60.0"

            # =========================
            # MySQL
            # =========================
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8"

            - name: DB_USERNAME
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            # =========================
            # Eureka
            # =========================
            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"

            # =========================
            # JWT
            # =========================
            - name: JWT_SECRET
              value: ""
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
