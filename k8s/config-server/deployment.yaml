apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: multi-vendor-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: config-server

  template:
    metadata:
      labels:
        app: config-server

    spec:
      containers:
        - name: config-server

          image: platform/config-server:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8888
              protocol: TCP

          env:
            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3